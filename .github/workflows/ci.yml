name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: /tmp/localsend-controller-target
  RUST_TOOLCHAIN: 1.97.1

jobs:
  controller:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt
      - name: Format
        run: rustup run "$RUST_TOOLCHAIN" cargo fmt --manifest-path controller/Cargo.toml -- --check
      - name: Lint
        run: rustup run "$RUST_TOOLCHAIN" cargo clippy --manifest-path controller/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test
        run: rustup run "$RUST_TOOLCHAIN" cargo test --manifest-path controller/Cargo.toml --locked
      - name: Build
        run: rustup run "$RUST_TOOLCHAIN" cargo build --manifest-path controller/Cargo.toml --locked --release
