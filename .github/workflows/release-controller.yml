name: Release controller

on:
  push:
    tags:
      - controller-v*

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  CONTROLLER_ASSET: localsend-controller-x86_64-unknown-linux-gnu
  RUST_TOOLCHAIN: 1.97.1

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/controller-target
    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate release tag
        run: '[[ "$GITHUB_REF_NAME" =~ ^controller-v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt
      - name: Format
        run: cargo fmt --manifest-path controller/Cargo.toml -- --check
      - name: Lint
        run: cargo clippy --manifest-path controller/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --manifest-path controller/Cargo.toml --locked
      - name: Build release artifact
        run: cargo build --manifest-path controller/Cargo.toml --locked --release
      - name: Package artifact and checksum
        run: |
          install -D -m 0755 "$CARGO_TARGET_DIR/release/localsend-controller" "dist/$CONTROLLER_ASSET"
          digest="$(sha256sum "dist/$CONTROLLER_ASSET")"
          printf '%s  %s\n' "${digest%% *}" "$CONTROLLER_ASSET" > "dist/$CONTROLLER_ASSET.sha256"
      - name: Attest artifact provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/${{ env.CONTROLLER_ASSET }}
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'Built from source commit `%s` with Rust `%s` on GitHub-hosted Ubuntu 24.04. Verify the downloaded binary with the attached SHA-256 checksum and GitHub artifact attestation.\n' "$GITHUB_SHA" "$RUST_TOOLCHAIN" > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            "dist/$CONTROLLER_ASSET" \
            "dist/$CONTROLLER_ASSET.sha256" \
            --verify-tag \
            --title "LocalSend controller ${GITHUB_REF_NAME#controller-v}" \
            --notes-file release-notes.md
