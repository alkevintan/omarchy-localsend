[package]
name = "localsend-controller"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
bytes = "1.11"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
futures-util = "0.3"
gethostname = "1.0"
libc = "0.2"
localsend = { git = "https://github.com/localsend/localsend.git", rev = "af0416be50770a97760f7070684bc667b759a15c", default-features = false, features = ["discovery"] }
mime_guess = "2.0"
pem = "4.0"
rcgen = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.49", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1.20", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.24"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
